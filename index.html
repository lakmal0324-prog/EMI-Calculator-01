<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leasing EMI Calculator & Rate Sheet</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --success-color: #16a34a;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .nav-tabs {
            display: flex;
            background-color: #f1f5f9;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: none;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--accent-color);
            border-bottom: 3px solid var(--accent-color);
        }

        .tab-content {
            padding: 25px;
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .result-box {
            margin-top: 25px;
            padding: 18px;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            display: none;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #cbd5e1;
            font-size: 0.95rem;
        }

        .result-row.highlight {
            border-bottom: none;
            margin-top: 8px;
            padding-top: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--success-color);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('user-tab')">EMI Calculator</button>
        <button class="tab-btn" onclick="switchTab('admin-tab')">Admin Rate Config</button>
    </div>

    <!-- User Calculator Tab -->
    <div id="user-tab" class="tab-content active">
        <h2>Leasing Calculator</h2>
        
        <div class="form-group">
            <label>Loan Amount (Rs.):</label>
            <input type="number" id="amount" placeholder="e.g. 1000000" value="1000000">
        </div>

        <div class="form-group">
            <label>Annual Interest Rate (%):</label>
            <input type="number" id="rate" step="0.01" placeholder="e.g. 12" value="12">
        </div>

        <div class="form-group">
            <label>Tenure (Months):</label>
            <select id="months">
                <option value="12">12 Months (1 Year)</option>
                <option value="24">24 Months (2 Years)</option>
                <option value="36">36 Months (3 Years)</option>
                <option value="48">48 Months (4 Years)</option>
                <option value="60" selected>60 Months (5 Years)</option>
                <option value="72">72 Months (6 Years)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Balloon Payment Amount (Rs.):</label>
            <input type="number" id="balloon" placeholder="0 if none" value="0">
        </div>

        <button class="btn" onclick="calculateEMI()">Calculate EMI</button>

        <div class="result-box" id="resultBox">
            <div class="result-row">
                <span>Total Interest:</span>
                <span id="resInterest">Rs. 0.00</span>
            </div>
            <div class="result-row">
                <span>Total Payable Amount:</span>
                <span id="resTotal">Rs. 0.00</span>
            </div>
            <div class="result-row highlight">
                <span>Monthly EMI:</span>
                <span id="resEMI">Rs. 0.00</span>
            </div>
        </div>
    </div>

    <!-- Admin Panel Tab -->
    <div id="admin-tab" class="tab-content">
        <h2>Rate Sheet Admin Settings</h2>
        
        <div class="form-group">
            <label>Default Base Interest Rate (% p.a.):</label>
            <input type="number" id="adminBaseRate" step="0.01" value="12.00">
        </div>

        <button class="btn" style="background-color: var(--primary-color);" onclick="saveAdminSettings()">Save to Firebase</button>
    </div>
</div>

<!-- Firebase Modular SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ඔයාගේ Firebase Console එකෙන් ලැබෙන Config එක මෙතැනට යොදන්න
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const rateDocRef = doc(db, "settings", "rateConfig");

    // Real-time Update Rate from Firebase
    onSnapshot(rateDocRef, (docSnap) => {
        if (docSnap.exists()) {
            const data = docSnap.data();
            if (data.baseRate) {
                document.getElementById('rate').value = data.baseRate;
                document.getElementById('adminBaseRate').value = data.baseRate;
            }
        }
    });

    // Save Rate to Firebase
    window.saveAdminSettings = async function() {
        const newRate = parseFloat(document.getElementById('adminBaseRate').value);
        try {
            await setDoc(rateDocRef, { baseRate: newRate }, { merge: true });
            alert("Rate Sheet updated successfully in Firebase!");
            switchTab('user-tab');
        } catch (error) {
            alert("Firebase Error: " + error.message);
        }
    };
</script>

<script>
    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        
        if (tabId === 'user-tab') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
        }
        document.getElementById(tabId).classList.add('active');
    }

    // Flat Rate + Balloon Payment Formula
    function calculateEMI() {
        let P = parseFloat(document.getElementById('amount').value) || 0;
        let R = parseFloat(document.getElementById('rate').value) || 0;
        let M = parseInt(document.getElementById('months').value) || 0;
        let B = parseFloat(document.getElementById('balloon').value) || 0;

        if (P <= 0 || R <= 0 || M <= 0) {
            alert("Please enter valid loan details.");
            return;
        }

        if (B >= P) {
            alert("Balloon Amount must be less than the Total Loan Amount.");
            return;
        }

        // Correct Leasing Formula
        let totalInterest = P * (R / 100) * (M / 12);
        let principalToAmortize = P - B;
        let monthlyEMI = (principalToAmortize + totalInterest) / M;
        let grandTotal = P + totalInterest;

        document.getElementById('resInterest').innerText = "Rs. " + totalInterest.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('resTotal').innerText = "Rs. " + grandTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        document.getElementById('resEMI').innerText = "Rs. " + monthlyEMI.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

        document.getElementById('resultBox').style.display = 'block';
    }
</script>

</body>
</html>
