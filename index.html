<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMI Calculator with Admin Panel</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background-color: #0056b3; }
    .hidden { display: none; }
    .error { color: red; margin-top: 10px; font-size: 14px; }
    .success { color: green; margin-top: 10px; font-size: 14px; }
    .user-list { text-align: left; margin-top: 15px; max-height: 200px; overflow-y: auto; }
    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; }
    .approve-btn { width: auto; padding: 5px 10px; margin: 0; background-color: #28a745; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="login-card" class="card">
    <h2>Login</h2>
    <input type="email" id="login-email" placeholder="Email Address">
    <input type="password" id="login-password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p>ගිණුමක් නැද්ද? <a href="#" onclick="showScreen('register-card')">Register වෙන්න</a></p>
    <div id="login-msg"></div>
  </div>

  <!-- 2. REGISTER SCREEN -->
  <div id="register-card" class="card hidden">
    <h2>Register</h2>
    <input type="text" id="reg-name" placeholder="Full Name">
    <input type="email" id="reg-email" placeholder="Email Address">
    <input type="password" id="reg-password" placeholder="Password">
    <button onclick="register()">Register</button>
    <p>ගිණුමක් තියෙනවා නම් <a href="#" onclick="showScreen('login-card')">Login වෙන්න</a></p>
    <div id="reg-msg"></div>
  </div>

  <!-- 3. PENDING APPROVAL SCREEN -->
  <div id="pending-card" class="card hidden">
    <h2>Approval Pending</h2>
    <p>ඔබගේ Registration එක සාර්ථකයි. Admin අනුමත (Approve) කරන තෙක් App එක භාවිතා කිරීමට නොහැක.</p>
    <button onclick="logout()">Logout</button>
  </div>

  <!-- 4. MAIN EMI CALCULATOR (FOR APPROVED USERS) -->
  <div id="app-card" class="card hidden">
    <h2>EMI Calculator</h2>
    <p id="welcome-msg"></p>
    
    <label style="text-align:left; display:block;">Loan Amount (රු.):</label>
    <input type="number" id="loan-amount" placeholder="500000">

    <label style="text-align:left; display:block;">Interest Rate Policy:</label>
    <select id="rate-select">
      <option value="12">Personal Loan (12%)</option>
      <option value="15">Housing Loan (15%)</option>
      <option value="18">Microfinance (18%)</option>
    </select>

    <label style="text-align:left; display:block;">Tenure (Months):</label>
    <input type="number" id="months" placeholder="12">

    <button onclick="calculateEMI()">Calculate EMI</button>

    <div id="emi-result" style="margin-top: 15px; font-weight: bold; font-size: 18px; color: #007bff;"></div>
    
    <button onclick="logout()" style="background-color: #dc3545; margin-top: 20px;">Logout</button>
  </div>

  <!-- 5. ADMIN PANEL (FOR APPROVING USERS) -->
  <div id="admin-card" class="card hidden">
    <h2>Admin Dashboard</h2>
    <p>Approve නොකළ Users ලාගේ ලැයිස්තුව:</p>
    <div id="pending-users" class="user-list"></div>
    <button onclick="logout()" style="background-color: #dc3545; margin-top: 20px;">Logout</button>
  </div>

  <!-- FIREBASE ENGINE & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA86NUK-UXZJxCkPUUjVPNV4Cjm20XpWAo",
      authDomain: "emi-calculator-9e048.firebaseapp.com",
      databaseURL: "https://emi-calculator-9e048-default-rtdb.firebaseio.com",
      projectId: "emi-calculator-9e048",
      storageBucket: "emi-calculator-9e048.firebasestorage.app",
      messagingSenderId: "181063869117",
      appId: "1:181063869117:web:e75cf8af947f7c0aa80dd4",
      measurementId: "G-G3ZE9WP5SD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Navigation Switcher
    window.showScreen = (id) => {
      ['login-card', 'register-card', 'pending-card', 'app-card', 'admin-card'].forEach(card => {
        document.getElementById(card).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
    };

    // Auth State Observer - Logic Enforcement
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // Admin Check (Special Admin Email)
        if (user.email === "admin@emicalc.com") {
          showScreen('admin-card');
          loadPendingUsers();
          return;
        }

        const userRef = ref(db, 'users/' + user.uid);
        const snapshot = await get(userRef);

        if (snapshot.exists()) {
          const userData = snapshot.val();
          if (userData.isApproved === true) {
            showScreen('app-card');
            document.getElementById('welcome-msg').innerText = "සාදරයෙන් පිළිගනිමු, " + userData.name;
          } else {
            showScreen('pending-card');
          }
        }
      } else {
        showScreen('login-card');
      }
    });

    // Register User
    window.register = async () => {
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const msg = document.getElementById('reg-msg');

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        await set(ref(db, 'users/' + user.uid), {
          name: name,
          email: email,
          isApproved: false
        });

        msg.className = "success";
        msg.innerText = "ලියාපදිංචිය සාර්ථකයි! Admin අනුමත කරන තෙක් රැඳී සිටින්න.";
      } catch (error) {
        msg.className = "error";
        msg.innerText = error.message;
      }
    };

    // Login User
    window.login = async () => {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const msg = document.getElementById('login-msg');

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (error) {
        msg.className = "error";
        msg.innerText = error.message;
      }
    };

    // Logout
    window.logout = () => signOut(auth);

    // Calculate EMI Logic
    window.calculateEMI = () => {
      const p = parseFloat(document.getElementById('loan-amount').value);
      const r = parseFloat(document.getElementById('rate-select').value) / 12 / 100;
      const n = parseFloat(document.getElementById('months').value);

      if(!p || !r || !n) {
        alert("කරුණාකර හිස්තැන් පුරවන්න!");
        return;
      }

      const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      document.getElementById('emi-result').innerText = `මසකට ගෙවිය යුතු මුදල: රු. ${emi.toFixed(2)}`;
    };

    // Admin Panel - Load Pending Users
    async function loadPendingUsers() {
      const usersRef = ref(db, 'users');
      const snapshot = await get(usersRef);
      const container = document.getElementById('pending-users');
      container.innerHTML = "";

      if (snapshot.exists()) {
        const data = snapshot.val();
        for (let uid in data) {
          if (!data[uid].isApproved) {
            container.innerHTML += `
              <div class="user-item">
                <span>${data[uid].name} (${data[uid].email})</span>
                <button class="approve-btn" onclick="approveUser('${uid}')">Approve</button>
              </div>
            `;
          }
        }
      }
    }

    // Admin Approve Action
    window.approveUser = async (uid) => {
      await update(ref(db, 'users/' + uid), { isApproved: true });
      alert("User Approved!");
      loadPendingUsers();
    };
  </script>
</body>
