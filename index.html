<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMI Calculator</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
    button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 16px; }
    button:hover { background-color: #0056b3; }
    .hidden { display: none; }
    .error { color: red; margin-top: 10px; font-size: 14px; }
    .success { color: green; margin-top: 10px; font-size: 14px; }
    .user-list { text-align: left; margin-top: 15px; max-height: 250px; overflow-y: auto; }
    .user-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; background: #f9f9f9; margin-bottom: 5px; border-radius: 5px; }
    .approve-btn { width: auto; padding: 6px 12px; margin: 0; background-color: #28a745; font-size: 13px; }
  </style>
</head>
<body>

  <!-- 1. LOGIN / REGISTER SCREEN -->
  <div id="auth-card" class="card">
    <h2>Welcome to EMI Calc</h2>
    <p>ඇතුළු වීමට ඔබේ නම සහ දුරකථන අංකය ඇතුළත් කරන්න.</p>
    <input type="text" id="user-name" placeholder="ඔබේ නම (Name)">
    <input type="tel" id="user-phone" placeholder="දුරකථන අංකය (Phone Number)">
    <button onclick="handleLoginRegister()">Enter / Register</button>
    <div id="auth-msg"></div>
  </div>

  <!-- 2. PENDING APPROVAL SCREEN -->
  <div id="pending-card" class="card hidden">
    <h2>Approval Pending ⏳</h2>
    <p>ඔබගේ තොරතුරු ලැබුණි. Admin අනුමත (Approve) කරන තෙක් කරුණාකර රැඳී සිටින්න.</p>
    <button onclick="checkStatus()" style="background-color: #17a2b8;">Check Status</button>
    <button onclick="logout()" style="background-color: #dc3545;">Exit</button>
  </div>

  <!-- 3. MAIN EMI CALCULATOR -->
  <div id="app-card" class="card hidden">
    <h2>EMI Calculator</h2>
    <p id="welcome-msg" style="font-weight: bold; color: #28a745;"></p>
    
    <label style="text-align:left; display:block; margin-top:10px;">Loan Amount (ණය මුදල):</label>
    <input type="number" id="loan-amount" placeholder="500000">

    <label style="text-align:left; display:block; margin-top:10px;">Interest Rate Policy:</label>
    <select id="rate-select">
      <option value="12">Personal Loan (12%)</option>
      <option value="15">Housing Loan (15%)</option>
      <option value="18">Microfinance (18%)</option>
    </select>

    <label style="text-align:left; display:block; margin-top:10px;">Tenure (මාස ගණන):</label>
    <input type="number" id="months" placeholder="12">

    <button onclick="calculateEMI()">Calculate EMI</button>

    <div id="emi-result" style="margin-top: 15px; font-weight: bold; font-size: 18px; color: #007bff;"></div>
    <button onclick="logout()" style="background-color: #dc3545; margin-top: 20px;">Logout</button>
  </div>

  <!-- 4. ADMIN PANEL -->
  <div id="admin-card" class="card hidden">
    <h2>Admin Dashboard 👑</h2>
    <p>Users අනුමත කරන්න:</p>
    <div id="pending-users" class="user-list"></div>
    <button onclick="logout()" style="background-color: #dc3545; margin-top: 20px;">Exit Admin</button>
  </div>

  <!-- FIREBASE ENGINE & LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA86NUK-UXZJxCkPUUjVPNV4Cjm20XpWAo",
      authDomain: "emi-calculator-9e048.firebaseapp.com",
      databaseURL: "https://emi-calculator-9e048-default-rtdb.firebaseio.com",
      projectId: "emi-calculator-9e048",
      storageBucket: "emi-calculator-9e048.firebasestorage.app",
      messagingSenderId: "181063869117",
      appId: "1:181063869117:web:e75cf8af947f7c0aa80dd4",
      measurementId: "G-G3ZE9WP5SD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Navigation Switcher
    function showScreen(id) {
      ['auth-card', 'pending-card', 'app-card', 'admin-card'].forEach(card => {
        document.getElementById(card).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
    }

    // Auto Login Check from Local Storage
    window.onload = () => {
      const savedPhone = localStorage.getItem('userPhone');
      if (savedPhone) {
        verifyUser(savedPhone);
      }
    };

    // Handle Login / Registration
    window.handleLoginRegister = async () => {
      const name = document.getElementById('user-name').value.trim();
      const phone = document.getElementById('user-phone').value.trim();
      const msg = document.getElementById('auth-msg');

      if (!name || !phone) {
        msg.className = "error";
        msg.innerText = "කරුණාකර නම සහ Phone Number එක ඇතුළත් කරන්න!";
        return;
      }

      // Admin Login Check (Phone: 0000)
      if (phone === "0000") {
        localStorage.setItem('userPhone', '0000');
        showScreen('admin-card');
        loadPendingUsers();
        return;
      }

      const userRef = ref(db, 'users/' + phone);
      const snapshot = await get(userRef);

      if (snapshot.exists()) {
        // User already exists
        localStorage.setItem('userPhone', phone);
        verifyUser(phone);
      } else {
        // New User Register
        await set(userRef, {
          name: name,
          phone: phone,
          isApproved: false
        });
        localStorage.setItem('userPhone', phone);
        showScreen('pending-card');
      }
    };

    // Verify Approval Status
    async function verifyUser(phone) {
      if (phone === "0000") {
        showScreen('admin-card');
        loadPendingUsers();
        return;
      }

      const userRef = ref(db, 'users/' + phone);
      const snapshot = await get(userRef);

      if (snapshot.exists()) {
        const userData = snapshot.val();
        if (userData.isApproved === true) {
          showScreen('app-card');
          document.getElementById('welcome-msg').innerText = "සාදරයෙන් පිළිගනිමු, " + userData.name;
        } else {
          showScreen('pending-card');
        }
      } else {
        showScreen('auth-card');
      }
    }

    window.checkStatus = () => {
      const savedPhone = localStorage.getItem('userPhone');
      if (savedPhone) verifyUser(savedPhone);
    };

    window.logout = () => {
      localStorage.removeItem('userPhone');
      showScreen('auth-card');
    };

    // Calculate EMI
    window.calculateEMI = () => {
      const p = parseFloat(document.getElementById('loan-amount').value);
      const r = parseFloat(document.getElementById('rate-select').value) / 12 / 100;
      const n = parseFloat(document.getElementById('months').value);

      if(!p || !r || !n) {
        alert("කරුණාකර හිස්තැන් පුරවන්න!");
        return;
      }

      const emi = (p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      document.getElementById('emi-result').innerText = `මසකට ගෙවිය යුතු මුදල: රු. ${emi.toFixed(2)}`;
    };

    // Admin Panel Functions
    async function loadPendingUsers() {
      const usersRef = ref(db, 'users');
      const snapshot = await get(usersRef);
      const container = document.getElementById('pending-users');
      container.innerHTML = "";

      if (snapshot.exists()) {
        const data = snapshot.val();
        for (let phone in data) {
          if (!data[phone].isApproved) {
            container.innerHTML += `
              <div class="user-item">
                <span><b>${data[phone].name}</b><br>${phone}</span>
                <button class="approve-btn" onclick="approveUser('${phone}')">Approve</button>
              </div>
            `;
          }
        }
      }
    }

    window.approveUser = async (phone) => {
      await update(ref(db, 'users/' + phone), { isApproved: true });
      alert("User Approved!");
      loadPendingUsers();
    };
  </script>
</body>
</html>
